# ============================================================================
# Redis Configuration Profile
# ============================================================================
# To use Redis in your service, include this profile in your application.yml:
#
#   spring:
#     profiles:
#       include: redis
#
# This provides base Redis configuration. Override specific settings in your service.
# ============================================================================

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis-12876.c232.us-east-1-2.ec2.cloud.redislabs.com}
      port: ${REDIS_PORT:12876}
      username: default
      password: ${REDIS_PASSWORD:kC0EhAnL6Wlmj7ycIGyJHt0ryVGIkcqh}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        shutdown-timeout: 2000ms
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
